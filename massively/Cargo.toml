[package]
autotests = false
authors.workspace = true
description = "Multi-platform GPU parallel algorithms for Rust."
edition.workspace = true
license.workspace = true
name = "massively"
readme = "../README.md"
repository.workspace = true
version = "0.93.0"

[dependencies]
cubecl.workspace = true
futures-lite = "2.6"

[dev-dependencies]
criterion = "0.5"
cubecl = { workspace = true, features = ["wgpu"] }
static_assertions = "1"

